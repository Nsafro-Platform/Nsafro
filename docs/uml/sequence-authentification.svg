7813" style="stroke: #4A5568; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="18" x="591" y="517.7153">11</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="125" x="613" y="517.7153">Vérifie le cookie JWT</text><polygon fill="#4A5568" points="314,560.9141,304,564.9141,314,568.9141,310,564.9141" style="stroke: #4A5568; stroke-width: 1.0;"/><line style="stroke: #4A5568; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="308" x2="583" y1="564.9141" y2="564.9141"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="18" x="320" y="559.8481">12</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="154" x="342" y="559.8481">200 utilisateur connecté</text><!--MD5=[ed630045dca56faca7b758c723ce4352]
@startuml sequence-authentification

title <b>Nsafro — Séquence : connexion d'un utilisateur</b>

autonumber
skinparam shadowing false
skinparam ArrowColor #4A5568
skinparam sequence {
  LifeLineBorderColor #2C6E9B
  ParticipantBackgroundColor #DCEAF5
  ParticipantBorderColor #2C6E9B
}

actor "Utilisateur" as U
participant "Application React" as SPA
participant "API Express" as API
database "PostgreSQL" as DB

U -> SPA : Saisit e-mail et mot de passe
SPA -> API : POST /api/auth/login
API -> DB : SELECT * FROM users WHERE email = ...
DB - -> API : utilisateur (ou aucun)

alt Identifiants invalides
  API - -> SPA : 401 « Invalid email or password »
  SPA - -> U : Affiche l'erreur
else Identifiants valides
  API -> API : bcrypt.compare(mot de passe, hash)
  API - -> SPA : 200 utilisateur + cookie JWT (httpOnly)
  SPA - -> U : Redirige vers la page demandée
end

group Restauration de session
  SPA -> API : GET /api/auth/me
  API -> API : Vérifie le cookie JWT
  API - -> SPA : 200 utilisateur connecté
end

@enduml

